; PlatformIO Project Configuration File
;
; One folder per project under src/; build_src_filter picks which one an env
; compiles. Add a project: create src/<name>/ and copy an env block.
;
;   pio run -e thingcube -t upload

[common]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8 ; Library by knolleary
    bblanchon/ArduinoJson@^6.18.5 ; Library by bblanchon
    h2zero/NimBLE-Arduino@^1.4.1 ; NimBLE-Arduino brings a stable BLE stack

; USB CDC on boot — serial over the C3's native USB port
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:thingcube]
extends = common
build_src_filter = +<thingcube/>
lib_deps =
    ${common.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit SH110X@^2.1.11

[env:devkit-test]
extends = common
build_src_filter = +<devkit-test/>
